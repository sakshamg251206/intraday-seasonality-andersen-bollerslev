[project]
name = "intraday-seasonality"
version = "1.0.0"
description = "Replication and extension of Andersen & Bollerslev (1997): intraday periodicity and volatility persistence"
authors = [{ name = "Saksham Garg" }]
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "statsmodels",
    "arch",
    "matplotlib",
    "requests",
]

[dependency-groups]
dev = ["pytest", "jupyter", "nbconvert"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intraday"]

[tool.pytest.ini_options]
testpaths = ["tests"]
